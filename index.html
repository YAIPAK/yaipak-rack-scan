<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YAIPAK Rack Scan</title>
<meta name="theme-color" content="#14181d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
/* Layout: one column of step panels, thumb-sized controls, sticky save bar. Rack-label world: shelf colors red/blue/green, signage type. */
:root{
  --bg:#eef0f2; --panel:#ffffff; --ink:#14181d; --muted:#5b6570; --line:#cfd5db;
  --accent:#f2b705; --accent-ink:#14181d; --ok:#1f7a3a; --warn:#b3261e;
  --s1:#c62828; --s2:#1565c0; --s3:#2e7d32;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1215; --panel:#1a1f25; --ink:#eef1f4; --muted:#9aa5b1; --line:#2d353e;
  --accent:#f2b705; --accent-ink:#14181d; --ok:#4cc27a; --warn:#ff6b5e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 17px/1.4 var(--body);
  padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 8px;max-width:560px;margin:0 auto}
header h1{font:700 26px/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase}
header .net{font:500 13px var(--mono);color:var(--muted)}
main{display:grid;gap:12px;max-width:560px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
.panel h2{font:700 15px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;justify-content:space-between}
label{font:600 14px var(--body);color:var(--muted);display:grid;gap:6px}
input,select,textarea{font:600 19px var(--body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px;width:100%;min-height:52px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.mono{font-family:var(--mono)}
button{font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase;border-radius:8px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);min-height:52px;padding:0 16px;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 0;min-width:0}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px}
.seg button{border-color:var(--line);font-size:17px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.loc{display:flex;align-items:center;gap:12px}
.chip{font:700 40px/1 var(--display);letter-spacing:.04em;padding:10px 14px;border-radius:8px;color:#fff;background:var(--muted);min-width:0}
.chip.s1{background:var(--s1)}.chip.s2{background:var(--s2)}.chip.s3{background:var(--s3)}
.chip.empty{background:transparent;color:var(--muted);border:2px dashed var(--line);font-size:24px}
.locmeta{font:500 15px var(--body);color:var(--muted)}
#reader{width:100%;border-radius:8px;overflow:hidden;background:#000}
.found{border-left:6px solid var(--ok);padding:10px 12px;background:var(--bg);border-radius:6px;display:grid;gap:4px}
.found.miss{border-left-color:var(--warn)}
.found b{font:700 20px var(--body)}
.found small{color:var(--muted);font-size:14px}
.hint{font-size:14px;color:var(--muted);margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.date3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px}
footer.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
footer.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);
  font:600 16px var(--body);padding:12px 16px;border-radius:8px;max-width:92vw;z-index:5}
#toast.bad{background:var(--warn);color:#fff}
@media (prefers-reduced-motion:no-preference){.chip{transition:background .2s}}
</style>
</head>
<body>
<header><h1>Rack Scan</h1><span class="net" id="net">online</span></header>
<main>

  <section class="panel" aria-labelledby="h-loc">
    <h2 id="h-loc">1 · Spot</h2>
    <div class="loc">
      <div class="chip empty" id="locChip">No spot</div>
      <div class="locmeta" id="locMeta">Scan the beam label or placard</div>
    </div>
    <div class="row">
      <button type="button" id="camLoc">Camera</button>
      <input id="locIn" class="mono" placeholder="Handheld: scan here" autocomplete="off" enterkeyhint="done" aria-label="Spot code">
    </div>
    <label>Stack level
      <div class="seg" style="--n:2" data-group="stack">
        <button type="button" data-v="Bottom (or only pallet)" aria-pressed="true">Bottom / only</button>
        <button type="button" data-v="Top (stacked)" aria-pressed="false">Top</button>
      </div>
    </label>
  </section>

  <section class="panel" aria-labelledby="h-act">
    <h2 id="h-act">2 · Action</h2>
    <div class="seg" data-group="action">
      <button type="button" data-v="IN - Putting items in" aria-pressed="true">In</button>
      <button type="button" data-v="OUT - Taking items out" aria-pressed="false">Out</button>
      <button type="button" data-v="START - Initial count" aria-pressed="false">Count</button>
    </div>
  </section>

  <section class="panel" id="itemPanel" aria-labelledby="h-item">
    <h2 id="h-item">3 · Item</h2>
    <div class="row">
      <button type="button" id="camUpc">Camera</button>
      <input id="upc" class="mono" inputmode="numeric" placeholder="Handheld: scan UPC" autocomplete="off" enterkeyhint="search" aria-label="UPC">
    </div>
    <div id="result" class="found" hidden aria-live="polite"></div>
    <label>What is it?<input id="name" placeholder="Brand, item, size" autocomplete="off"></label>
    <label>Pallet ID<input id="pallet" class="mono" placeholder="Scan pallet tag (optional)" autocomplete="off"></label>
  </section>

  <section class="panel" aria-labelledby="h-qty">
    <h2 id="h-qty">4 · Count</h2>
    <div class="seg" data-group="unit">
      <button type="button" data-v="Pallet" aria-pressed="true">Pallet</button>
      <button type="button" data-v="Box" aria-pressed="false">Box</button>
      <button type="button" data-v="Individual item" aria-pressed="false">Item</button>
    </div>
    <div class="grid2">
      <label>Quantity<input id="qty" type="number" inputmode="numeric" min="1" value="1"></label>
      <label id="bppWrap">Boxes per pallet<input id="bpp" type="number" inputmode="numeric" min="1"></label>
      <label id="upbWrap">Units per box<input id="upb" type="number" inputmode="numeric" min="1"></label>
    </div>
    <div id="expWrap"><label>Expiration (optional)</label>
      <div class="date3"><input id="em" inputmode="numeric" placeholder="MM" maxlength="2" aria-label="Month"><input id="ed" inputmode="numeric" placeholder="DD" maxlength="2" aria-label="Day"><input id="ey" inputmode="numeric" placeholder="YYYY" maxlength="4" aria-label="Year"></div>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-who">
    <h2 id="h-who">5 · Who</h2>
    <label>Your name<input id="who" autocomplete="name"></label>
    <label>Notes<textarea id="notes" rows="2"></textarea></label>
  </section>

  <div id="camBox" class="panel" hidden>
    <h2><span id="camTitle">Scanning</span><button type="button" id="camStop" style="min-height:36px;font-size:14px">Close</button></h2>
    <div id="reader"></div>
  </div>
</main>

<footer class="bar"><div class="in">
  <button type="button" id="saveNext">Save + next here</button>
  <button type="button" class="primary" id="saveDone">Save</button>
</div></footer>
<div id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";
const FORM_ID = "262725329716059";
const SUBMIT_URL = "https://yaipak.jotform.com/submit/" + FORM_ID;
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem("rs_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem("rs_" + k, JSON.stringify(v)); } catch {} }
};
const state = { loc: null, stack: "Bottom (or only pallet)", action: "IN - Putting items in", unit: "Pallet" };
const t0 = Date.now();

/* ---------- toast ---------- */
let toastT;
function toast(msg, bad){ const el = $("toast"); el.textContent = msg; el.className = bad ? "bad" : ""; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3500); }

/* ---------- segmented controls ---------- */
document.querySelectorAll(".seg").forEach(seg => {
  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    state[seg.dataset.group] = b.dataset.v; render();
  });
});
function setSeg(group, v){ const seg = document.querySelector('.seg[data-group="' + group + '"]'); seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === v ? "true" : "false")); state[group] = v; }

/* ---------- location parsing ---------- */
// Accepts a beam/placard QR link (?q3_dropdown1=Bay 4&rack=A&q4_dropdown2=1&side=L),
// a ?loc=4-A-1-L link, or a plain code like 4-A-1-L.
function parseLoc(raw){
  if (!raw) return null; raw = String(raw).trim();
  try {
    const u = new URL(raw, location.href); const p = u.searchParams;
    const bay = (p.get("q3_dropdown1") || p.get("bay") || "").replace(/\D/g, "");
    if (bay && p.get("rack") && p.get("q4_dropdown2") && p.get("side")) return mk(bay, p.get("rack"), p.get("q4_dropdown2"), p.get("side"));
    if (p.get("loc")) raw = p.get("loc");
  } catch {}
  const m = raw.toUpperCase().match(/(\d+)\s*-\s*([A-Z])\s*-\s*([1-3])\s*-\s*([LR])/);
  return m ? mk(m[1], m[2], m[3], m[4]) : null;
}
function mk(bay, rack, shelf, side){
  bay = String(bay); rack = String(rack).toUpperCase(); shelf = String(shelf); side = String(side).toUpperCase();
  if (!["4","5","7","8"].includes(bay) || !/^[A-S]$/.test(rack) || !/^[1-3]$/.test(shelf) || !/^[LR]$/.test(side)) return null;
  return { bay, rack, shelf, side, code: bay + "-" + rack + "-" + shelf + "-" + side };
}
function setLoc(l){
  if (!l){ toast("That is not a spot label. Scan the beam label or placard.", true); return; }
  state.loc = l; render(); try { navigator.vibrate && navigator.vibrate(60); } catch {}
  if (state.action !== "OUT - Taking items out") setTimeout(() => $("upc").focus(), 50);
}
$("locIn").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); setLoc(parseLoc(e.target.value)); e.target.value = ""; } });
$("locIn").addEventListener("change", e => { if (e.target.value){ setLoc(parseLoc(e.target.value)); e.target.value = ""; } });

/* ---------- UPC lookup (live, in the browser) ---------- */
// Learned names on this device come first. Then the free open product databases,
// which allow browser lookups: food, beauty/personal care, household goods.
const learned = store.get("learned", {});
const SOURCES = [
  ["food", "https://world.openfoodfacts.org/api/v2/product/"],
  ["personal care", "https://world.openbeautyfacts.org/api/v2/product/"],
  ["household", "https://world.openproductsfacts.org/api/v2/product/"]
];
let lookupSeq = 0;
async function lookup(upc){
  const seq = ++lookupSeq; const res = $("result");
  upc = upc.replace(/\D/g, "");
  if (upc.length < 8){ res.hidden = true; return; }
  if (learned[upc]){ showFound(learned[upc], "Logged before on this device"); return; }
  res.className = "found"; res.hidden = false; res.innerHTML = "<small>Looking up " + upc + "…</small>";
  const hits = await Promise.all(SOURCES.map(async ([kind, base]) => {
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 6000);
      const r = await fetch(base + upc + ".json?fields=product_name,brands,quantity", { signal: ctl.signal });
      clearTimeout(to); const j = await r.json();
      if (j.status === 1 && j.product && j.product.product_name) return { kind, p: j.product };
    } catch {}
    return null;
  }));
  if (seq !== lookupSeq) return;
  const hit = hits.find(Boolean);
  if (hit){
    const p = hit.p; const brand = (p.brands || "").split(",")[0].trim();
    let nm = p.product_name.trim();
    if (brand && !nm.toLowerCase().includes(brand.toLowerCase())) nm = brand + " " + nm;
    if (p.quantity && !nm.includes(p.quantity)) nm += " " + p.quantity;
    showFound(nm, "Found in " + hit.kind + " database");
  } else {
    res.className = "found miss"; res.hidden = false;
    res.innerHTML = "<b>Not found</b><small>Type the item below. Make will price it and flag it for review.</small>";
    $("name").value = ""; $("name").focus();
  }
}
function showFound(nm, src){
  const res = $("result"); res.className = "found"; res.hidden = false;
  res.innerHTML = ""; const b = document.createElement("b"); b.textContent = nm;
  const s = document.createElement("small"); s.textContent = src + ". Fix the name below if it is wrong.";
  res.append(b, s); $("name").value = nm;
}
$("upc").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); lookup(e.target.value); } });
$("upc").addEventListener("change", e => lookup(e.target.value));

/* ---------- camera scanning ---------- */
let scanner = null, scanTarget = null;
async function openCam(target){
  if (typeof Html5Qrcode === "undefined"){ toast("Camera scanner did not load. Use the handheld or type it.", true); return; }
  scanTarget = target; $("camTitle").textContent = target === "loc" ? "Point at spot label" : "Point at barcode";
  $("camBox").hidden = false; $("camBox").scrollIntoView({ behavior: "smooth", block: "center" });
  try {
    if (!scanner) scanner = new Html5Qrcode("reader", { verbose: false });
    const F = Html5QrcodeSupportedFormats;
    await scanner.start({ facingMode: "environment" }, {
      fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * .85), height: Math.floor(Math.min(h, w) * (target === "loc" ? .75 : .45)) }),
      formatsToSupport: [F.QR_CODE, F.UPC_A, F.UPC_E, F.EAN_13, F.EAN_8, F.CODE_128]
    }, onScan, () => {});
  } catch (err){ closeCam(); toast("Camera blocked. Allow camera access for this page, or use the handheld.", true); }
}
async function closeCam(){ $("camBox").hidden = true; try { if (scanner && scanner.isScanning) await scanner.stop(); } catch {} }
function onScan(text){
  const tgt = scanTarget; closeCam();
  if (tgt === "loc") setLoc(parseLoc(text));
  else if (tgt === "upc"){ $("upc").value = text.replace(/\D/g, ""); lookup(text); }
  else if (tgt === "pallet"){ $("pallet").value = text.trim(); }
}
$("camLoc").onclick = () => openCam("loc");
$("camUpc").onclick = () => openCam("upc");
$("camStop").onclick = closeCam;

/* ---------- render ---------- */
function render(){
  const l = state.loc, chip = $("locChip");
  if (l){ chip.className = "chip s" + l.shelf; chip.textContent = l.code; $("locMeta").textContent = "Bay " + l.bay + " · Rack " + l.rack + " · Shelf " + l.shelf + (l.shelf === "3" ? " (floor)" : l.shelf === "1" ? " (top)" : "") + " · " + (l.side === "L" ? "Left" : "Right"); }
  else { chip.className = "chip empty"; chip.textContent = "No spot"; $("locMeta").textContent = "Scan the beam label or placard"; }
  const out = state.action === "OUT - Taking items out";
  $("itemPanel").hidden = out; $("expWrap").hidden = out;
  $("bppWrap").hidden = out || state.unit !== "Pallet";
  $("upbWrap").hidden = out || state.unit === "Individual item";
  $("net").textContent = navigator.onLine ? "online" : "offline · " + queue().length + " waiting";
}

/* ---------- submit (into the existing Jotform, so Make runs unchanged) ---------- */
function queue(){ return store.get("queue", []); }
function buildParams(more){
  const l = state.loc, out = state.action === "OUT - Taking items out", p = new URLSearchParams();
  const add = (k, v) => { if (v !== undefined && v !== null && String(v) !== "") p.append(k, v); };
  add("formID", FORM_ID); add("simple_spc", FORM_ID + "-" + FORM_ID); add("submitSource", "form");
  add("timeToSubmit", Math.max(5, Math.round((Date.now() - t0) / 1000)));
  add("q3_q3_dropdown1", "Bay " + l.bay); add("q17_rack", l.rack); add("q4_q4_dropdown2", l.shelf); add("q18_side", l.side);
  add("q22_stackLevel", state.stack); add("q6_q6_radio4", state.action);
  add("q8_q8_number6", $("qty").value); add("q9_q9_radio7", state.unit);
  if (!out){
    add("q20_typeA", $("upc").value.replace(/\D/g, "")); add("q7_q7_textbox5", $("name").value.trim());
    add("q23_palletId", $("pallet").value.trim());
    if (state.unit === "Pallet") add("q19_boxesPer", $("bpp").value);
    if (state.unit !== "Individual item") add("q10_q10_number8", $("upb").value);
    if ($("em").value && $("ed").value && $("ey").value){ add("q11_q11_datetime9[month]", $("em").value.padStart(2, "0")); add("q11_q11_datetime9[day]", $("ed").value.padStart(2, "0")); add("q11_q11_datetime9[year]", $("ey").value); }
  }
  add("q16_yourName", $("who").value.trim()); add("q14_q14_textarea12", $("notes").value.trim());
  add("q21_moreItems", more ? "Yes" : "No");
  return p.toString();
}
function validate(){
  if (!state.loc) return "Scan the spot first.";
  if (!$("who").value.trim()) return "Add your name.";
  if (!(+$("qty").value > 0)) return "Enter a quantity.";
  if (state.action !== "OUT - Taking items out"){
    if (!$("name").value.trim()) return "Scan a UPC or type what the item is.";
    if (state.unit !== "Individual item" && !(+$("upb").value > 0)) return "Enter units per box. It sets the pallet value.";
    if (state.unit === "Pallet" && !(+$("bpp").value > 0)) return "Enter boxes per pallet.";
  }
  return "";
}
async function post(body){
  await fetch(SUBMIT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
}
async function flush(){
  const q = queue(); if (!q.length || !navigator.onLine) { render(); return; }
  const left = [];
  for (const b of q){ try { await post(b); } catch { left.push(b); } }
  store.set("queue", left); render();
  if (q.length > left.length) toast("Sent " + (q.length - left.length) + " saved scan(s).");
}
async function save(more){
  const err = validate(); if (err){ toast(err, true); return; }
  const body = buildParams(more);
  const upc = $("upc").value.replace(/\D/g, ""), nm = $("name").value.trim();
  if (upc && nm && state.action !== "OUT - Taking items out"){ learned[upc] = nm; store.set("learned", learned); }
  store.set("who", $("who").value.trim());
  try { if (!navigator.onLine) throw new Error("offline"); await post(body); toast("Logged " + state.loc.code + ". " + (more ? "Next item, same spot." : "Scan the next spot.")); }
  catch { const q = queue(); q.push(body); store.set("queue", q); toast("No signal. Saved on this phone. It sends when you reconnect.", true); }
  ["upc", "name", "pallet", "notes", "em", "ed", "ey"].forEach(id => $(id).value = ""); $("qty").value = 1; $("result").hidden = true;
  if (!more) state.loc = null;
  render(); (more ? $("upc") : $("locIn")).focus();
}
$("saveNext").onclick = () => save(true);
$("saveDone").onclick = () => save(false);
window.addEventListener("online", flush); window.addEventListener("offline", render);

/* ---------- boot ---------- */
$("who").value = store.get("who", "");
const fromUrl = parseLoc(location.href); if (fromUrl) state.loc = fromUrl;
render(); flush();
})();
</script>
</body>
</html>
